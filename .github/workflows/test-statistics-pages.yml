name: Test statistics Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: gh-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install test reporter
        run: python3 -m pip install pytest

      - name: Run tests and write JUnit report
        run: |
          mkdir -p test-results
          python3 -m pytest test --junitxml=test-results/results.xml

      - name: Prepare site directory
        run: mkdir -p site

      - name: Restore existing Pages content
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags origin gh-pages
            git archive FETCH_HEAD | tar -x -C site
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "No gh-pages branch exists yet; starting a new site."
            else
              exit "$status"
            fi
          fi

      - name: Generate test statistics dashboard
        run: bash src/update-stats.sh
        env:
          RESULTS_DIR: downloaded-results
          SITE_DIR: site
          SHELL_TESTS_XML: test-results/results.xml
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Link test statistics in workflow summary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pages_url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)
          printf '[View test statistics dashboard](%s/stats/)\n' "${pages_url%/}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Add Pages landing page
        run: cp src/site-index.html site/index.html

      - name: Install screenshot tools
        run: |
          python3 -m pip install Pillow
          npm install --global playwright@1.55.0
          playwright install --with-deps chromium

      - name: Take dashboard screenshots
        shell: bash
        run: |
          mkdir -p screenshots
          python3 -m http.server 4173 --directory site >/tmp/test-stats-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/stats/ >/dev/null; then
              break
            fi
            sleep 1
          done
          playwright screenshot \
            --browser=chromium \
            --viewport-size="1200,900" \
            --wait-for-timeout=3000 \
            --full-page \
            http://127.0.0.1:4173/stats/ \
            screenshots/stats-dashboard-full.png
          python3 src/split_screenshot.py \
            screenshots/stats-dashboard-full.png \
            docs/screenshots
          rm screenshots/stats-dashboard-full.png

      - uses: actions/upload-artifact@v7
        with:
          name: pages-site
          path: site

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-screenshots
          path: docs/screenshots

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pages-site
          path: site

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dashboard-screenshots
          path: docs/screenshots

      - name: Update README screenshots
        run: python3 src/update_readme_screenshots.py README.md docs/screenshots

      - name: Commit dashboard screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "docs: update test statistics screenshots" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
          fi

      - name: Publish dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
